<style>
:root{
  --paper:#eef2f5; --sheet:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d5dde5;
  --accent:#2446a6; --accent-ink:#ffffff; --soft:#e3e9f6; --danger:#b3261e; --ok:#1d7a4a;
  --display:ui-rounded, "SF Pro Rounded", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#10151c; --sheet:#18202a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2b3644;
    --accent:#7e9cf0; --accent-ink:#0e1420; --soft:#1f2b40; --danger:#f2867e; --ok:#6fd1a0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.wrap{
  max-width:560px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
  padding-top:calc(16px + env(safe-area-inset-top));
  padding-bottom:150px;
  display:flex; flex-direction:column; gap:18px;
}
header{display:flex; align-items:flex-end; gap:12px}
.rx{font-family:var(--display); font-weight:700; font-size:44px; line-height:1; color:var(--accent)}
h1{font-family:var(--display); font-weight:700; font-size:26px; line-height:1.1; margin:0}
.to{font-size:13px; color:var(--muted); margin:2px 0 0; word-break:break-all}

.card{background:var(--sheet); border:1px solid var(--line); border-radius:14px; padding:18px 16px; display:flex; flex-direction:column; gap:16px}
.label{display:block; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
input, select, textarea{
  width:100%; font:inherit; font-size:17px; color:var(--ink);
  background:var(--sheet); border:1px solid var(--line); border-radius:10px;
  padding:12px; min-height:48px; appearance:none; -webkit-appearance:none;
}
select{
  background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:calc(100% - 20px) 21px, calc(100% - 14px) 21px;
  background-size:6px 6px; background-repeat:no-repeat; padding-right:36px;
}
textarea{min-height:96px; resize:vertical}
input:focus, select:focus, textarea:focus, button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

.meds{display:flex; flex-direction:column; gap:10px}
.med{display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center}
.med input.name{min-width:0}
.qty{display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; height:48px}
.qty button{width:36px; height:100%; border:0; background:var(--soft); color:var(--accent); font-size:20px; font-weight:700}
.qty input{width:40px; border:0; border-radius:0; text-align:center; padding:0; min-height:0; height:100%; font-variant-numeric:tabular-nums}
.del{width:40px; height:48px; border:0; background:transparent; color:var(--muted); font-size:22px; border-radius:10px}
.hint{font-size:13px; color:var(--muted); margin:0}
.add{align-self:flex-start; border:1px dashed var(--accent); color:var(--accent); background:transparent; border-radius:10px; padding:10px 14px; font:inherit; font-weight:700}

.preview{background:var(--sheet); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.preview .head{padding:12px 16px; border-bottom:1px solid var(--line); font-size:14px; display:flex; flex-direction:column; gap:2px}
.preview .head span{color:var(--muted)}
.preview pre{margin:0; padding:16px; white-space:pre-wrap; word-wrap:break-word; font-family:var(--body); font-size:16px; line-height:1.5}
.tools{display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 16px}
.ghost{border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:10px; padding:10px 12px; font:inherit; font-size:14px; font-weight:700}

.bar{
  position:fixed; left:0; right:0; bottom:0;
  background:var(--paper);
  border-top:1px solid var(--line);
  padding-top:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
}
.bar .in{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:6px}
.send{display:block; text-align:center; text-decoration:none; background:var(--accent); color:var(--accent-ink); border-radius:12px; padding:15px; font-family:var(--display); font-weight:700; font-size:18px}
.send[aria-disabled="true"], .alt[aria-disabled="true"]{opacity:.4; pointer-events:none}
.alt{display:block; text-align:center; font-size:14px; font-weight:700; color:var(--accent); text-decoration:underline; text-underline-offset:3px; padding:4px}
.status{font-size:13px; color:var(--muted); text-align:center; min-height:18px; margin:0}
.status.err{color:var(--danger)}
.status.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="rx" aria-hidden="true">℞</div>
    <div>
      <h1>Richiesta ricette</h1>
      <p class="to">a studiomedicodott.mazzone@gmail.com</p>
    </div>
  </header>

  <form class="card" id="f" novalidate>
    <div>
      <label class="label" for="paziente">Paziente</label>
      <select id="paziente">
        <option>Alessio Quieti</option>
        <option>Silvia Pisanu</option>
      </select>
    </div>
    <div>
      <span class="label">Medicinali e n. confezioni</span>
      <div class="meds" id="meds"></div>
      <p class="hint" style="margin-top:8px">Le righe vuote non vengono inserite nella mail.</p>
    </div>
    <button type="button" class="add" id="add">+ Aggiungi medicinale</button>
    <div>
      <label class="label" for="note">Note</label>
      <textarea id="note" placeholder="Es. ritiro la ricetta venerdì mattina"></textarea>
    </div>
  </form>

  <section class="preview" aria-label="Anteprima email">
    <div class="head">
      <div><span>A:</span> studiomedicodott.mazzone@gmail.com</div>
      <div><span>Oggetto:</span> <b id="pvSubj"></b></div>
    </div>
    <pre id="pvBody"></pre>
    <div class="tools">
      <button type="button" class="ghost" id="cpBody">Copia testo</button>
      <button type="button" class="ghost" id="cpTo">Copia indirizzo</button>
      <button type="button" class="ghost" id="reset">Svuota</button>
    </div>
  </section>
</div>

<div class="bar">
  <div class="in">
    <a class="send" id="send" href="#">Apri in Gmail</a>
    <a class="alt" id="sendMail" href="#">Usa l'app Mail</a>
    <p class="status" id="status"></p>
  </div>
</div>

<script>
const TO = "studiomedicodott.mazzone@gmail.com";
const $ = id => document.getElementById(id);
const medsEl = $("meds");
let rid = 0;

function addRow(name = "", qty = 1){
  const i = ++rid;
  const row = document.createElement("div");
  row.className = "med";
  row.innerHTML = `
    <input class="name" id="med-${i}" type="text" placeholder="Nome medicinale" autocomplete="off" autocapitalize="sentences" aria-label="Medicinale">
    <div class="qty">
      <button type="button" data-d="-1" aria-label="Meno">−</button>
      <input id="qty-${i}" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Numero confezioni">
      <button type="button" data-d="1" aria-label="Più">+</button>
    </div>
    <button type="button" class="del" aria-label="Rimuovi riga">×</button>`;
  row.querySelector(".name").value = name;
  row.querySelector(".qty input").value = qty;
  row.querySelectorAll(".qty button").forEach(b => b.addEventListener("click", () => {
    const q = row.querySelector(".qty input");
    q.value = Math.max(1, (parseInt(q.value) || 1) + Number(b.dataset.d));
    update();
  }));
  row.querySelector(".del").addEventListener("click", () => {
    row.remove();
    if (!medsEl.children.length) addRow();
    update();
  });
  row.addEventListener("input", update);
  medsEl.appendChild(row);
  return row;
}

function collect(){
  const meds = [...medsEl.querySelectorAll(".med")].map(r => ({
    name: r.querySelector(".name").value.trim(),
    qty: Math.max(1, parseInt(r.querySelector(".qty input").value) || 1)
  })).filter(m => m.name);
  return { paziente: $("paziente").value, meds, note: $("note").value.trim() };
}

function build({paziente, meds, note}){
  const lines = ["Buona sera,", ""];
  if (meds.length){
    lines.push(`sono ${paziente} e chiedo cortesemente la prescrizione ${meds.length === 1 ? "del seguente medicinale" : "dei seguenti medicinali"}:`, "");
    meds.forEach(m => lines.push(`- ${m.name}: ${m.qty} ${m.qty === 1 ? "confezione" : "confezioni"}`));
    if (note) lines.push("", note);
  } else {
    lines.push(`sono ${paziente} e vi scrivo per quanto segue:`, "", note || "…");
  }
  lines.push("", "Grazie mille", "", paziente);
  const subject = meds.length ? `Richiesta ricette – ${paziente}` : `Comunicazione – ${paziente}`;
  return { subject, body: lines.join("\n") };
}

function update(){
  const d = collect();
  const { subject, body } = build(d);
  $("pvSubj").textContent = subject;
  $("pvBody").textContent = body;
  const empty = !d.meds.length && !d.note;
  const s = encodeURIComponent(subject), b = encodeURIComponent(body), t = encodeURIComponent(TO);
  const send = $("send"), mail = $("sendMail");
  send.setAttribute("aria-disabled", empty);
  mail.setAttribute("aria-disabled", empty);
  send.href = `googlegmail:///co?to=${t}&subject=${s}&body=${b}`;
  mail.href = `mailto:${TO}?subject=${s}&body=${b}`;
  setStatus(empty ? "Inserisci almeno un medicinale o una nota." : "");
  try { localStorage.setItem("ricette-paziente", d.paziente); } catch(e){}
}

function setStatus(msg, cls = ""){
  const s = $("status"); s.textContent = msg; s.className = "status " + cls;
}

async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); setStatus(okMsg, "ok"); }
  catch(e){
    const r = document.createRange(); r.selectNodeContents($("pvBody"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    setStatus("Testo selezionato: tieni premuto e scegli Copia.", "err");
  }
}

function reset(){
  medsEl.innerHTML = "";
  $("note").value = "";
  addRow().querySelector(".name").placeholder = "Es. Eutirox 50 mcg";
  update();
}

$("add").addEventListener("click", () => { addRow().querySelector(".name").focus(); update(); });
$("paziente").addEventListener("change", update);
$("note").addEventListener("input", update);
$("cpBody").addEventListener("click", () => copy($("pvBody").textContent, "Testo copiato."));
$("cpTo").addEventListener("click", () => copy(TO, "Indirizzo copiato."));
$("reset").addEventListener("click", reset);
$("f").addEventListener("submit", e => e.preventDefault());

try { const p = localStorage.getItem("ricette-paziente"); if (p) $("paziente").value = p; } catch(e){}
reset();
</script>
</body>
</html>
